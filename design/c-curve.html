<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.phone{--bg:#f4f5f7;--ac:#ff5a36;--ink:#15181d;--dim:#6a717c;--line:#e2e5ea;color:var(--ink)}
.statusbar{color:#333}
.top{display:flex;align-items:center;justify-content:space-between;margin:6px 18px}.top b{font-size:19px}
.ab{display:flex;background:#e8ebef;border-radius:12px;padding:3px}.ab span{padding:7px 12px;border-radius:9px;font-size:13px;color:var(--dim);font-weight:600}.ab .on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.curve{margin:10px 12px 0;background:#fff;border-radius:18px;padding:10px 6px 4px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.curve svg{display:block;width:100%}
.legend{display:flex;gap:14px;font-size:11.5px;color:var(--dim);padding:0 10px 4px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.gr{margin:12px 12px 0;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.gr h3{margin:0 0 10px;font-size:13px;display:flex;justify-content:space-between}.gr h3 span{color:var(--dim);font-weight:400}
.bands{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.b{text-align:center;font-size:11px;color:var(--dim)}
.b .v{height:84px;background:#eef0f3;border-radius:8px;position:relative;overflow:hidden;margin-bottom:5px}.b .v i{position:absolute;left:0;right:0;top:0;background:linear-gradient(180deg,var(--ac),#ff9a6b);border-radius:8px 8px 0 0}
.b b{display:block;color:var(--ink);font-size:13px}.b.sel .v{outline:2px solid var(--ac)}
.detail{margin:12px 12px 0;background:#fff;border-radius:18px;padding:12px 14px;box-shadow:0 2px 10px rgba(0,0,0,.05);font-size:13px}
.detail .r{display:flex;justify-content:space-between;padding:6px 0;border-top:1px solid var(--line)}.detail .r:first-of-type{border-top:0}
.tabs{background:#fff;border-top:1px solid var(--line);color:var(--ink)}.tabs .sel{color:var(--ac)}
</style></head><body><div class="phone">
