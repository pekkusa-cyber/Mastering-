<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="base.css"><style>
.phone{--bg:radial-gradient(120% 70% at 50% 25%,#2a1d3f 0%,#140f1f 55%,#0c0a12 100%);--ac:#b58cff;--line:rgba(255,255,255,.09)}
.top{display:flex;justify-content:space-between;align-items:center;margin:8px 20px}.top b{font-size:18px}.pill{font-size:12px;padding:6px 10px;border:1px solid var(--line);border-radius:14px;color:#cdbcf0}
.knob{margin:30px auto 0;width:250px;height:250px;border-radius:50%;position:relative;display:grid;place-items:center;
background:conic-gradient(from 220deg,var(--ac) 0deg,#ff7ab6 170deg,rgba(255,255,255,.06) 170deg 280deg,transparent 280deg)}
.knob::before{content:'';position:absolute;inset:14px;border-radius:50%;background:radial-gradient(circle at 40% 30%,#2d2342,#16111f)}
.knob div{position:relative;text-align:center}.knob strong{font-size:58px;font-weight:700;letter-spacing:-2px}.knob span{display:block;color:#b9a8da;font-size:13px}
.styles{display:flex;gap:8px;justify-content:center;margin-top:26px;flex-wrap:wrap;padding:0 20px}.styles span{padding:9px 14px;border-radius:20px;border:1px solid var(--line);font-size:13.5px;color:#d9ccf5}.styles .sel{background:var(--ac);color:#1a1029;border-color:var(--ac);font-weight:600}
.ab{margin:24px 40px 0;display:grid;grid-template-columns:1fr 1fr;border-radius:28px;background:rgba(255,255,255,.05);padding:5px;border:1px solid var(--line)}
.ab div{text-align:center;padding:14px;border-radius:24px;font-weight:600;color:#a898c6}.ab .on{background:#fff;color:#1a1029}
.spec{display:flex;align-items:flex-end;gap:3px;height:54px;margin:26px 30px 0}.spec i{flex:1;border-radius:2px;background:linear-gradient(180deg,#ff7ab6,var(--ac))}
.fine{margin:18px auto 0;width:max-content;padding:10px 18px;border-radius:20px;border:1px solid var(--line);font-size:13.5px;color:#d9ccf5}
.tabs{background:rgba(12,10,18,.9);border-top:1px solid var(--line)}.tabs .sel{color:var(--ac)}
</style></head><body><div class="phone">
